apiVersion: v1
kind: Service
metadata:
  name: cloud-native-platform-app
  labels:
    app: cloud-native-platform-app
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app: cloud-native-platform-app
